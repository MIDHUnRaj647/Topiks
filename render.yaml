services:
  # ── Backend Web Service (ASP.NET Core + PostgreSQL + OCR via Docker) ──
  - type: web
    name: topiks-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/nodes/root
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DATABASE_URL
        fromDatabase:
          name: topiks-db
          property: connectionString

  # ── Frontend Static Site on Render ──
  - type: web
    name: topiks-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build --configuration=production
    staticPublishPath: ./frontend/dist/frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: topiks-db
    databaseName: topiks
    user: topiks_user
    plan: free
    region: oregon
