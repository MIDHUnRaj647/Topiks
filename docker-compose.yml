version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: topiks-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    volumes:
      - topiks-data:/app/data
      - topiks-storage:/app/storage
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: topiks-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  topiks-data:
  topiks-storage:
